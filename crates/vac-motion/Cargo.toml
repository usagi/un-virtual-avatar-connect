[package]
rust-version = "1.100"
name = "vac-motion"
version = "0.10.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
log = "0.4.29"
rosc = "0.11.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52", features = ["macros", "net", "rt"] }
un-motion-frame = "1.1.0"
un-motion-frame-zenoh = { version = "1.0.0", default-features = false }
