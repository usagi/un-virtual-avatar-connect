# =========================================================================
#  conf.example-voice.toml  (v2)
# =========================================================================
# 音声入力（Vosk / Whisper）の **リファレンス**。
#
# v2 移行状況（重要）:
#   Voice は Flowgraph 側の `flowgraph.ingress.voice` ノードから起動します。
#   v1 時代の `[[processors]] feature = "voice"` は廃止済みで、残っていても警告のみです。
#   engine / model_path / language_code などは `flowgraph.ingress.voice` の properties に書きます。
#
# 対応する Flowgraph サンプル:
#   flowgraph.example/voice-input/   ← ingress.voice → TTS echo の最小サンプル
#
# =========================================================================


# -------------------------------------------------------------------------
# 1. ビルドフィーチャー
# -------------------------------------------------------------------------
# - Vosk（既定の Voice エンジン）: 通常の `cargo build` で有効（`default` に `voice-vosk`）
#   - Vosk を外す: `cargo build --no-default-features`
#   - Windows: build.rs が GitHub Releases の `vosk-win64-*.zip` を
#     `.vendors/vosk-win64/{version}/` に展開（初回のみ DL）、`libvosk.dll` と
#     MinGW 同梱 DLL を `target/{debug|release}/` と `deps/` にコピー
#   - バージョン変更: 環境変数 `VOSK_WIN64_VERSION`（既定 0.3.45）
#   - 手動配置に切り替え: `VOSK_LIB_PATH` = `libvosk.lib` があるディレクトリ
# - Whisper: portable releaseに同梱する外部Vulkan workerを使用し、初期化失敗時はCPU workerへ逐次fallbackする
# - Vosk / Whisperを選択可能な一般配布: `cargo xtask release-build --variant portable`
# - 1個のingressでは指定したengineだけを起動する。VoskとWhisperの同時認識は行わない


# -------------------------------------------------------------------------
# 2. Voice ingress 設定（Flowgraph）
# -------------------------------------------------------------------------
# `flowgraph.example/voice-input/main.flowgraph.toml` の `flowgraph.ingress.voice`
# ノードを参照してください。代表的な properties:
#
# [[nodes]]
# id = "in"
# feature = "flowgraph.ingress.voice"
# properties.engine = "vosk"
# properties.model_path = "vosk-model-small-ja-0.22"
# properties.language_code = "ja"
# properties.fixed_channel = "voice"
#
# --- Whisper を使う例 ---
# # properties.engine = "whisper"
# # properties.model_path = "small"
# # properties.language_code = "ja"
# # properties.whisper_backend = "auto" # auto / vulkan / cpu
# # properties.whisper_gpu_device = ""   # 空ならdGPU優先。明示時はVulkan device index


# -------------------------------------------------------------------------
# 3. `flowgraph.ingress.voice` ノード（v2 Flowgraph 側の受け口）
# -------------------------------------------------------------------------
# このノードを含む Flowgraph がロードされると、VAC はノードごとに voice worker を起動します。
# 認識した確定テキストが `content` / `source_kind` ポートから下流へ流れます。


# -------------------------------------------------------------------------
# 4. モデル選択の参考
# -------------------------------------------------------------------------
# Vosk（https://alphacephei.com/vosk/models）:
#   - `vosk-model-small-ja-0.22`   小さい、リアルタイム寄り（配信向け）
#   - `vosk-model-ja-0.22`         精度重視（約 1 秒弱の遅延）
#
# Whisper（https://huggingface.co/ggerganov/whisper.cpp/tree/main）:
#   - `tiny` / `base` / `small` / `medium` / `large-v3` ...
#   - `properties.model_path` にプリセット名を書くと ggml-{name}.bin を自動取得。
#   - 絶対パスで手元に置いた ggml ファイルを指すことも可能。


# -------------------------------------------------------------------------
# 5. OS のマイク許可
# -------------------------------------------------------------------------
# Windows 10/11 ではプライバシー設定でマイク使用を許可する必要があります（デスクトップアプリ枠）。
