[package]
rust-version = "1.100"
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
csv = "1.4.0"
flate2 = "1.1.5"
jiff = "0.2.24"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11"
sysinfo = "0.38.4"
tar = "0.4.44"
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
vac-motion = { path = "../crates/vac-motion" }
zenoh = "1.9.0"
