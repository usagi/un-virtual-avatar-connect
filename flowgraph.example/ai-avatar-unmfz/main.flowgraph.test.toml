[[triggers]]
node = "main::avatar_intent_in"

[[triggers.overrides]]
port = "__content__"
ty = "string"
value = "{\"target_link_id\":\"kaltsit_ai\",\"intents\":[{\"kind\":\"expression\",\"name\":\"concerned\",\"intensity\":0.45,\"duration_ms\":1200,\"curve\":\"hold\"},{\"kind\":\"head_nod\",\"count\":1,\"intensity\":0.35,\"duration_ms\":700,\"curve\":\"ease_out\"}]}"

[[triggers.overrides]]
port = "__channel__"
ty = "string"
value = "avatar_intent"

[[triggers.overrides]]
port = "__source_actor__"
ty = "string"
value = "Kaltsit"

[[triggers.overrides]]
port = "__is_final__"
ty = "bool"
value = true

