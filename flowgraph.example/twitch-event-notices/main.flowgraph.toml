[meta]
title = "Twitchイベント通知（チャット・画面）"
description = "個人名や報酬IDを持たない通知構成。OAuthは保存済みtoken keyから取得。"

[[nodes]]
id = "eventsub"
feature = "flowgraph.ingress.twitch_eventsub"
position = [80, 80]
[nodes.properties]
token_key = "broadcaster"
event_types = ["channel.channel_points_custom_reward_redemption.add", "channel.follow", "channel.subscribe", "channel.subscription.message", "channel.subscription.gift", "channel.raid"]

[[nodes]]
id = "notice"
feature = "flowgraph.twitch.event_notice"
position = [500, 80]

[[nodes]]
id = "notice_destination"
feature = "flowgraph.literal.string"
position = [80, 319]
[nodes.properties]
value = "stream-alerts"

[[nodes]]
id = "notice_overlay"
feature = "flowgraph.bos.output"
position = [920, 80]

[[nodes]]
id = "notice_token_key"
feature = "flowgraph.literal.string"
position = [80, 485]
[nodes.properties]
value = "moderator"

[[nodes]]
id = "notice_token"
feature = "flowgraph.twitch.get_token"
position = [920, 319]

[[nodes]]
id = "notice_identity"
feature = "flowgraph.twitch.validate_token"
position = [1340, 80]

[[nodes]]
id = "notice_chat"
feature = "flowgraph.twitch.chat_send"
position = [1760, 246]

