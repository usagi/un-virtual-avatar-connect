# Optional analysis only. No AI persona, Twitch, TTS or avatar output.
# Set the exact OBS scene/source and credential before triggering.
[meta]
title = "Screen analysis with Terra"
description = "Explicit OBS capture -> purpose-specific AI -> summary log"
tags = ["example", "ai", "obs"]

[[nodes]]
id = "request"
feature = "flowgraph.ingress.web_input"
position = [80, 100]

[[nodes]]
id = "scene"
feature = "flowgraph.literal.string"
position = [80, 300]
properties.value = "SET_OBS_SCENE"

[[nodes]]
id = "source"
feature = "flowgraph.literal.string"
position = [80, 400]
properties.value = "SET_GAME_SOURCE"

[[nodes]]
id = "capture"
feature = "flowgraph.obs.get_source_screenshot"
position = [350, 100]

[[nodes]]
id = "analysis"
feature = "flowgraph.ai.analyze"
position = [650, 100]
properties.purpose = "screen_detail"
properties.model = "gpt-6.1-terra"
properties.reasoning_effort = "none"
properties.instructions = "質問に関係する画面上の情報を抽出する。数値とラベルを保持する。"
properties.max_output_tokens = 1600
properties.timeout_ms = 30000

[[nodes]]
id = "show"
feature = "flowgraph.util.log"
position = [950, 100]

[[nodes]]
id = "error"
feature = "flowgraph.util.log"
position = [950, 300]

[[edges]]
from = "request:exec_out"
to = "capture:exec_in"
[[edges]]
from = "scene:value"
to = "capture:scene_name"
[[edges]]
from = "source:value"
to = "capture:source_name"
[[edges]]
from = "capture:exec_out"
to = "analysis:exec_in"
[[edges]]
from = "request:content"
to = "analysis:content"
[[edges]]
from = "capture:image_data_url"
to = "analysis:image_data_url"
[[edges]]
from = "capture:capture_metadata"
to = "analysis:context"
[[edges]]
from = "analysis:on_success"
to = "show:exec_in"
[[edges]]
from = "analysis:summary"
to = "show:value"
[[edges]]
from = "analysis:on_error"
to = "error:exec_in"
[[edges]]
from = "analysis:error"
to = "error:value"
