# =========================================================================
#  flowgraph.example/openai-persona/main.flowgraph.toml
# =========================================================================
# OpenAI AI ペルソナと Flowgraph の境界を示すサンプル。
#
# 前提:
#   - `conf.toml` に `[[ai.personas]]` を 1 つ以上定義（`conf.example-openai-chat.toml`）。
#   - AI は `channel_utterance = "ai"` に発話を emit する（常駐ループで独立稼働）。
#
#   `flowgraph.ingress.ai_speech` が AI の読み上げsegmentを受け、
#   `flowgraph.tts.speak` へ流す。
# =========================================================================

[meta]
title = "OpenAI Persona → TTS"
description = "AI persona の読み上げsegmentを専用境界からOS TTSへ流す最小サンプル。"
tags = ["example", "ai", "openai", "tts"]


# ---- AI 発話チャンネル購読 ----
[[nodes]]
id = "in"
feature = "flowgraph.ingress.ai_speech"
position = [80, 200]


# ---- TTS（OS 標準：追加インストール不要） ----
[[nodes]]
id = "engine"
feature = "flowgraph.literal.string"
position = [80, 380]
properties.value = "os"

[[nodes]]
id = "voice"
feature = "flowgraph.literal.string"
position = [80, 460]
properties.value = ""

[[nodes]]
id = "speak"
feature = "flowgraph.tts.speak"
position = [400, 260]


# ---- ログ ----
[[nodes]]
id = "log_ok"
feature = "flowgraph.util.log"
position = [720, 180]

[[nodes]]
id = "log_err"
feature = "flowgraph.util.log"
position = [720, 340]


# ---- 配線 ----
[[edges]]
from = "in:exec_out"
to = "speak:exec_in"
[[edges]]
from = "in:content"
to = "speak:text"
[[edges]]
from = "engine:value"
to = "speak:engine"
[[edges]]
from = "voice:value"
to = "speak:voice"

[[edges]]
from = "speak:on_success"
to = "log_ok:exec_in"
[[edges]]
from = "speak:audio_path"
to = "log_ok:value"

[[edges]]
from = "speak:on_error"
to = "log_err:exec_in"
[[edges]]
from = "speak:error"
to = "log_err:value"
