# UNVAC 2.0: malformed AvatarIntent -> neutral UNMF/Z dry-run。
#
# AI tool 出力が壊れていても危険な motion にしないことを確認する fixture 用 graph。
# `flowgraph.avatar.intent_to_unmf` は invalid intent を `ok=false` とし、空の
# UNMotionFrame を返す。v2.0 ではこれを neutral fallback として扱う。

[meta]
title = "ai avatar malformed intent fallback"
description = "Malformed AvatarIntent JSON -> neutral UNMF -> UNMF/Z dry-run"
tags = ["example", "avatar", "ai", "unmf", "unmfz", "negative"]

[[nodes]]
id = "avatar_intent_in"
feature = "flowgraph.ingress.ai_avatar_intent"
position = [80, 100]

[[nodes]]
id = "parse_intent"
feature = "flowgraph.json.parse"
position = [320, 100]

[[nodes]]
id = "elapsed_ms"
feature = "flowgraph.literal.int"
position = [320, 300]
properties.value = 350

[[nodes]]
id = "to_unmf"
feature = "flowgraph.avatar.intent_to_unmf"
position = [600, 100]

[[nodes]]
id = "unmfz_base_key"
feature = "flowgraph.literal.string"
position = [600, 360]
properties.value = "un-motion/frame/kaltsit-ai"

[[nodes]]
id = "unmfz_topic_mode"
feature = "flowgraph.literal.string"
position = [600, 440]
properties.value = "frame"

[[nodes]]
id = "unmfz_schema_major"
feature = "flowgraph.literal.int"
position = [600, 520]
properties.value = 1

[[nodes]]
id = "dry_run"
feature = "flowgraph.literal.bool"
position = [600, 600]
properties.value = true

[[nodes]]
id = "publish_unmfz"
feature = "flowgraph.unmfz.publish"
position = [880, 100]

[[nodes]]
id = "log_error"
feature = "flowgraph.util.log"
position = [880, 300]

[[edges]]
from = "avatar_intent_in:exec_out"
to = "publish_unmfz:exec_in"

[[edges]]
from = "avatar_intent_in:content"
to = "parse_intent:text"

[[edges]]
from = "parse_intent:value"
to = "to_unmf:intent"

[[edges]]
from = "elapsed_ms:value"
to = "to_unmf:elapsed_ms"

[[edges]]
from = "to_unmf:unmf"
to = "publish_unmfz:unmf"

[[edges]]
from = "unmfz_base_key:value"
to = "publish_unmfz:base_key_expr"

[[edges]]
from = "unmfz_topic_mode:value"
to = "publish_unmfz:topic_mode"

[[edges]]
from = "unmfz_schema_major:value"
to = "publish_unmfz:schema_major"

[[edges]]
from = "dry_run:value"
to = "publish_unmfz:dry_run"

[[edges]]
from = "avatar_intent_in:exec_out"
to = "log_error:exec_in"

[[edges]]
from = "to_unmf:error"
to = "log_error:value"
