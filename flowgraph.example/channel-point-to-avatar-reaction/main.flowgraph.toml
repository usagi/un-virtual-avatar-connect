# UNVAC 2.0: Twitch channel point redemption -> AvatarIntent -> UNMF/Z dry-run。
#
# channel point redemption を AI 判断なしの preset reaction として扱う最小例。
# 実配信では特定 reward id に絞るか、payload.reward.title を見て preset を分岐する。

[meta]
title = "Channel point to avatar reaction"
description = "Twitch channel point redemption maps to a preset AvatarIntent and UNMF/Z dry-run"
tags = ["example", "twitch", "eventsub", "channel_point", "avatar", "unmfz"]

[[nodes]]
id = "eventsub_in"
feature = "flowgraph.ingress.twitch_eventsub"
position = [80, 120]
properties.token_key = "broadcaster"
properties.event_types = ["channel.channel_points_custom_reward_redemption.add"]
properties.channel_points_reward_id = ""

[[nodes]]
id = "redemption_event_type"
feature = "flowgraph.literal.string"
position = [80, 320]
properties.value = "channel.channel_points_custom_reward_redemption.add"

[[nodes]]
id = "is_redemption"
feature = "flowgraph.string.contains"
position = [320, 160]

[[nodes]]
id = "redemption_branch"
feature = "flowgraph.flow.branch"
position = [560, 120]

[[nodes]]
id = "avatar_intent"
feature = "flowgraph.literal.json"
position = [560, 320]
properties.value = { target_link_id = "kaltsit_ai", intents = [
  { kind = "expression", name = "surprised", intensity = 0.45, duration_ms = 900, curve = "hold" },
  { kind = "head_nod", count = 1, intensity = 0.3, duration_ms = 650, curve = "ease_out" },
] }

[[nodes]]
id = "elapsed_ms"
feature = "flowgraph.literal.int"
position = [560, 560]
properties.value = 250

[[nodes]]
id = "to_unmf"
feature = "flowgraph.avatar.intent_to_unmf"
position = [820, 120]

[[nodes]]
id = "unmfz_base_key"
feature = "flowgraph.literal.string"
position = [820, 360]
properties.value = "un-motion/frame/kaltsit-ai"

[[nodes]]
id = "unmfz_topic_mode"
feature = "flowgraph.literal.string"
position = [820, 440]
properties.value = "frame"

[[nodes]]
id = "unmfz_schema_major"
feature = "flowgraph.literal.int"
position = [820, 520]
properties.value = 1

[[nodes]]
id = "dry_run"
feature = "flowgraph.literal.bool"
position = [820, 600]
properties.value = true

[[nodes]]
id = "publish_unmfz"
feature = "flowgraph.unmfz.publish"
position = [1100, 120]

[[nodes]]
id = "log_key"
feature = "flowgraph.util.log"
position = [1380, 120]

[[nodes]]
id = "log_ignored"
feature = "flowgraph.util.log"
position = [820, 240]

[[edges]]
from = "eventsub_in:event_type"
to = "is_redemption:haystack"

[[edges]]
from = "redemption_event_type:value"
to = "is_redemption:needle"

[[edges]]
from = "eventsub_in:exec_out"
to = "redemption_branch:exec_in"

[[edges]]
from = "is_redemption:result"
to = "redemption_branch:cond"

[[edges]]
from = "redemption_branch:then"
to = "publish_unmfz:exec_in"

[[edges]]
from = "redemption_branch:else"
to = "log_ignored:exec_in"

[[edges]]
from = "eventsub_in:event_type"
to = "log_ignored:value"

[[edges]]
from = "avatar_intent:value"
to = "to_unmf:intent"

[[edges]]
from = "elapsed_ms:value"
to = "to_unmf:elapsed_ms"

[[edges]]
from = "to_unmf:unmf"
to = "publish_unmfz:unmf"

[[edges]]
from = "unmfz_base_key:value"
to = "publish_unmfz:base_key_expr"

[[edges]]
from = "unmfz_topic_mode:value"
to = "publish_unmfz:topic_mode"

[[edges]]
from = "unmfz_schema_major:value"
to = "publish_unmfz:schema_major"

[[edges]]
from = "dry_run:value"
to = "publish_unmfz:dry_run"

[[edges]]
from = "publish_unmfz:on_success"
to = "log_key:exec_in"

[[edges]]
from = "publish_unmfz:key_expr"
to = "log_key:value"
