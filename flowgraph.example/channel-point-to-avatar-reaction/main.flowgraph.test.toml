[[triggers]]
node = "main::eventsub_in"

[[triggers.overrides]]
port = "__event_type__"
ty = "string"
value = "channel.channel_points_custom_reward_redemption.add"

[[triggers.overrides]]
port = "__actor_name__"
ty = "string"
value = "viewer1"

[[triggers.overrides]]
port = "__actor_login__"
ty = "string"
value = "viewer1"

[[triggers.overrides]]
port = "__payload__"
ty = "json"
value = "{\"reward\":{\"title\":\"Avatar reaction\"},\"user_name\":\"viewer1\",\"user_input\":\"surprise\"}"

[[tests]]
name = "channel point redemption emits preset avatar reaction"

[tests.expect]
node_count = 14
trigger_count = 1
trace_contains = [
  "unmfz.publish dry-run: un-motion/frame/kaltsit-ai/v1",
  "log: un-motion/frame/kaltsit-ai/v1",
]

[[tests.expect.exec_count]]
node = "main::publish_unmfz"
count = 1

[[tests.expect.exec_count]]
node = "main::log_key"
count = 1

[[tests.expect.exec_count]]
node = "main::log_ignored"
count = 0

[[tests.expect.stored_values]]
node = "main::to_unmf"
port = "target_link_id"
ty = "string"
value = "kaltsit_ai"

[[tests.expect.stored_values]]
node = "main::publish_unmfz"
port = "key_expr"
ty = "string"
value = "un-motion/frame/kaltsit-ai/v1"
