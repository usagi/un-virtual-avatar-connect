[meta]
title = "lambda-demo entry"
description = "typed moduleをgraph-as-nodeとして配置する最小entry。"

[[nodes]]
id = "text"
feature = "flowgraph.literal.string"
properties.value = "hello module"

[[instances]]
id = "child"
graph = "./module"
position = [360.0, 180.0]

[[edges]]
from = "text:value"
to = "child:text"
